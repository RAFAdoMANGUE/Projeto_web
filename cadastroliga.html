<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Criar Liga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ccccff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .caixa {
            background: #ffffff;
            border: 1px solid #000;
            padding: 20px;
            width: 320px;
            text-align: left;          
        }

        .caixa h1 {
            font-size: 20px;
            margin-bottom: 10px;
            text-align: center;        
        }

        .caixa label {
            display: block;
            font-size: 14px;
            margin-top: 8px;
        }

        .caixa input[type="text"] {
            width: 100%;
            padding: 5px;
            margin-top: 3px;
            font-size: 14px;
            border: 1px solid #000;
            box-sizing: border-box;    
        }
       
        .dica-campo {
            font-size: 12px;
            color: #555;
            margin-top: 2px;
        }
       
        .acoes {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }

        .acoes .botao,
        .acoes .botao-link {
            flex: 1;                   
            padding: 6px 10px;
            font-size: 14px;
            background: #dddddd;
            border: 1px solid #000;
            color: #000;
            cursor: pointer;
            text-align: center;
            text-decoration: none;     
        }
       
    </style>
</head>
<body>
    <div class="caixa">
        <h1>Criar Liga</h1>

        <form action="#" method="post">
            <label for="leagueId">Nome da liga</label>
            <input
                type="text"
                id="leagueId"
                name="leagueId"
                maxlength="15"
                required
            />

            <div class="dica-campo">
                Máximo de 15 caracteres (use letras, números ou sublinhado).
            </div>

            <div class="acoes">
                <a href="#" class="botao-link">Voltar</a>
                <button type="submit" class="botao">Criar liga</button>
            </div>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Tabela de Ligas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ccccff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .caixa {
            background: #ffffff;
            border: 1px solid #000;
            padding: 20px;
            width: 600px;
            box-sizing: border-box;
            text-align: left;
        }

        .caixa h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 15px;
        }

        .tabela-liga {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .tabela-liga th,
        .tabela-liga td {
            border: 1px solid #000;
            padding: 6px 8px;
            text-align: center;
        }

        .tabela-liga th {
            background: #ffffff;
            color: #000;
            text-align: center;
        }

        .tabela-liga a {
            color: #000;
            text-decoration: none;
        }

        .tabela-liga a:hover {
            text-decoration: underline;
        }

        .acoes {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
        }

        .botao-next,
        .botao-link {
            padding: 6px 16px;
            font-size: 14px;
            background: #dddddd;
            border: 1px solid #000;
            color: #000;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
        }

        .centro {
    text-align: center;
}
    </style>
</head>
<body>
    <div class="caixa">
        <h1>Tabela Ligas</h1>

        <table class="tabela-liga">
            <thead>
                <tr>
                    <th>Liga</th>
                    <th>Partidas</th>
                    <th>Pontuação</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                  <tr>
                    <td><a href="#">Nome da Liga 1</a></td>
                    <td class="centro">0</td>
                    <td class="centro">0</td>
                </tr>
                </tr>
                <tr>
                    <td><a href="#">Nome da Liga 2</a></td>
                    <td class="centro">0</td>
                    <td class="centro">0</td>
                </tr>
                <tr>
                    <td><a href="#">Nome da Liga 3</a></td>
                    <td class="centro">0</td>
                    <td class="centro">0</td>
                </tr>
            </tbody>
        </table>

         <div class="acoes">
            <a href="#" class="botao-link">Voltar</a>
            <button type="submit" class="botao-next">Próximo</button>
        </div>
    </div>
</body>
</html>

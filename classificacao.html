<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Pontuação geral</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ccccff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .caixa {
            background: #ffffff;
            border: 1px solid #000;
            padding: 20px;
            width: 600px;
            box-sizing: border-box;
            text-align: left;
        }

        .caixa h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 15px;
        }

        .tabela-pontuacao {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .tabela-pontuacao th,
        .tabela-pontuacao td {
            border: 1px solid #000;
            padding: 6px 8px;
        }

        .tabela-pontuacao th {
            text-align: center;
        }

        .acoes {
            margin-top: 12px;
        }

        .botao-link {
            padding: 6px 16px;
            font-size: 14px;
            background: #dddddd;
            border: 1px solid #000;
            color: #000;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
        }

        .centro {
    text-align: center;
}
    </style>
</head>
<body>
    <div class="caixa">
        <h1>Pontuação geral</h1>

        <table class="tabela-pontuacao">
            <thead>
                <tr>
                    <th>Ranking</th>
                    <th>Pontuação</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                  <tr>
                    <td class="centro">1</td>
                    <td class="centro">0</td>
                </tr>
                </tr>
                <tr>
                    <td class="centro">2</td>
                    <td class="centro">0</td>
                </tr>
                <tr>
                    <td class="centro">3</td>
                    <td class="centro">0</td>
                </tr>
            </tbody>
        </table>

        <div class="acoes">
            <a href="#" class="botao-link">Voltar</a>
        </div>
    </div>
</body>
</html>

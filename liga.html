<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Liga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ccccff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .caixa {
            background: #ffffff;
            border: 1px solid #000;
            padding: 20px;
            width: 600px;             
            box-sizing: border-box;
            text-align: left;
        }

        .caixa h1 {
            font-size: 20px;
            margin-bottom: 10px;
            text-align: center;
        }

        .caixa label {
            display: block;
            font-size: 14px;
            margin-top: 8px;
        }

        .caixa input[type="text"] {
            width: 100%;
            padding: 5px;
            margin-top: 3px;
            font-size: 14px;
            border: 1px solid #000;
            box-sizing: border-box;
        }

        .campo {
            font-size: 12px;
            color: #555;
            margin-top: 2px;
        }

        .tabela-jogadores {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 14px;
        }

        .tabela-jogadores th,
        .tabela-jogadores td {
            border: 1px solid #000;
            padding: 6px 8px;
        }

        .tabela-jogadores th {
            background: #ffffff;
            text-align: center;
        }

        .tabela-jogadores td {
            text-align: center;
        }

        .tabela-jogadores td.nome-jogador {
            text-align: center; 
        }

        .acoes {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
        }

        .botao-next,
        .botao-link {
            padding: 6px 16px;
            font-size: 14px;
            background: #dddddd;
            border: 1px solid #000;
            color: #000;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
        }

    </style>
</head>
<body>
    <div class="caixa">
        <h1>Detalhes da Liga</h1>
       
        <label for="nomeLiga">Nome da liga</label>
  
        <div class="campo">
            
        </div>

        <table class="tabela-jogadores">
            <thead>
                <tr>
                    <th>Nome do jogador</th>
                    <th>Partidas semanais</th>
                    <th>Pontuação semanal</th>
                    <th>Partidas totais</th>
                    <th>Pontuação total</th>
                </tr>
            </thead>
            <tbody>
              
                <tr>
                    <td class="nome-jogador">Jogador 1</td>
                    <td>5</td>
                    <td>30</td>
                    <td>120</td>
                    <td>120</td>
                </tr>
                <tr>
                    <td class="nome-jogador">Jogador 2</td>
                    <td>3</td>
                    <td>15</td>
                    <td>60</td>
                    <td>120</td>
                </tr>
                <tr>
                    <td class="nome-jogador">Jogador 3</td>
                    <td>7</td>
                    <td>40</td>
                    <td>200</td>
                    <td>120</td>
                </tr>
            </tbody>
        </table>

        <div class="acoes">
                <a href="#" class="botao-link">Voltar</a>
                <button type="submit" class="botao-next">Próximo</button>
        </div>
    </div>
</body>
</html>
